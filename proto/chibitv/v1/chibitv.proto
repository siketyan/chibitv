syntax = "proto3";

package chibitv.v1;

// ChibitvService exposes the backend operations used by the chibitv GUI.
service ChibitvService {
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);

  // RefreshEvents starts a background task collecting the programme guide and
  // returns it as soon as it is queued. Its progress is followed with
  // WatchTasks, and the events it collects are read back with ListEvents.
  rpc RefreshEvents(RefreshEventsRequest) returns (RefreshEventsResponse);

  // ListTasks returns every background task the server keeps, the running ones
  // and the recently finished ones alike.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);

  // WatchTasks streams the current tasks, then one message per task whenever
  // it changes, until the call is cancelled.
  rpc WatchTasks(WatchTasksRequest) returns (stream Task);

  // CancelTask asks a cancellable task to stop. It returns once the task is
  // told to stop, which it may take a moment to act on.
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);

  // ScheduleRecording books a recording of the event, as a task that starts
  // shortly before the event does. Cancelling that task calls the recording
  // off, or stops it while it runs.
  rpc ScheduleRecording(ScheduleRecordingRequest) returns (ScheduleRecordingResponse);

  // Stream tunes to the requested service and streams it while the call is
  // kept open. A tuner is occupied only while at least one client streams a
  // service on its physical channel, and clients requesting the same service
  // share a single tuner session.
  rpc Stream(StreamRequest) returns (stream StreamResponse);
}

message ListChannelsRequest {}

message ListChannelsResponse {
  repeated Channel channels = 1;
}

message Channel {
  uint32 id = 1;
  string name = 2;
  DeliverySystem delivery_system = 3;
}

// DeliverySystem is the broadcast wave a channel is carried on.
enum DeliverySystem {
  DELIVERY_SYSTEM_UNSPECIFIED = 0;

  // Terrestrial digital broadcasting.
  DELIVERY_SYSTEM_ISDB_T = 1;

  // Satellite (BS/CS 4K) broadcasting.
  DELIVERY_SYSTEM_ISDB_S = 2;
}

message ListServicesRequest {}

message ListServicesResponse {
  repeated Service services = 1;
}

message Service {
  uint32 id = 1;
  string name = 2;
  string provider_name = 3;
  uint32 channel_id = 4;
}

message ListEventsRequest {
  optional uint32 service_id = 1;
}

message ListEventsResponse {
  repeated Event events = 1;
}

message RefreshEventsRequest {
  // Time spent collecting events from each physical channel.
  // Zero uses the server default.
  uint32 dwell_time_seconds = 1;
}

message RefreshEventsResponse {
  // The task started for this refresh.
  Task task = 1;
}

message ListTasksRequest {}

message ListTasksResponse {
  repeated Task tasks = 1;
}

message WatchTasksRequest {}

message CancelTaskRequest {
  uint64 task_id = 1;
}

message CancelTaskResponse {
  // The task as it stands once it has been told to stop.
  Task task = 1;
}

message ScheduleRecordingRequest {
  uint32 service_id = 1;
  uint32 event_id = 2;
}

message ScheduleRecordingResponse {
  // The task the recording will run as.
  Task task = 1;
}

// TaskKind is the work a background task performs.
enum TaskKind {
  TASK_KIND_UNSPECIFIED = 0;

  // Collecting the programme guide from every configured channel.
  TASK_KIND_REFRESH_EVENTS = 1;

  // Recording one programme to the storage.
  TASK_KIND_RECORD = 2;
}

// TaskState is where a background task is in its lifetime.
enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;

  // Accepted, but not started yet.
  TASK_STATE_PENDING = 1;

  // Running right now.
  TASK_STATE_RUNNING = 2;

  // Finished having done its work.
  TASK_STATE_SUCCEEDED = 3;

  // Stopped by an error, described by the error field.
  TASK_STATE_FAILED = 4;

  // Stopped because it was cancelled.
  TASK_STATE_CANCELLED = 5;

  // Waiting for the time it is to start at.
  TASK_STATE_SCHEDULED = 6;
}

// Task is one unit of work running in the background of the server.
message Task {
  uint64 id = 1;
  TaskKind kind = 2;
  TaskState state = 3;

  // What the task does, as shown to the viewer.
  string title = 4;

  // What the task is doing right now, when it reports it.
  string message = 5;

  // How much of the work is done, between 0 and 1, when the task can tell.
  optional float progress = 6;

  // Whether the task stops when it is asked to.
  bool cancellable = 7;

  // Why the task failed, set only in the failed state.
  string error = 8;

  optional DateTime created_at = 9;

  // When a scheduled task is to start.
  optional DateTime scheduled_at = 12;

  optional DateTime started_at = 10;
  optional DateTime finished_at = 11;
}

message EventDescription {
  string name = 1;
  string content = 2;
}

message DateTime {
  int64 seconds = 1;
  uint32 nanos = 2;
}

message Event {
  uint32 id = 1;
  string title = 2;
  repeated EventDescription description = 3;
  optional DateTime start_time = 4;
  optional DateTime end_time = 5;
  uint32 service_id = 6;
}

message StreamRequest {
  // The service to tune to and stream.
  uint32 service_id = 1;
}

message StreamState {
  optional Service service = 1;
  optional Event event = 2;
}

message StreamResponse {
  oneof payload {
    StreamState state = 1;
    bytes fmp4 = 2;
  }
}
