[package]
name = "chibitv"
version = "0.3.0"
edition = "2024"

[dependencies]
chibitv_b25 = { path = "../chibitv_b25" }
chibitv_b10 = { path = "../chibitv_b10" }
chibitv_b24 = { path = "../chibitv_b24" }
chibitv_b60 = { path = "../chibitv_b60" }
chibitv_b61 = { path = "../chibitv_b61" }

anyhow = "1.0.103"
async-trait = "0.1.90"
axum = "0.8.9"
bitstream-io = "4.10.0"
buffa = "0.9.1"
bytes = "1.12.0"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
connectrpc = { version = "0.9.0", features = ["axum"] }
crc = "3.4.0"
hex = "0.4.3"
mpeg2ts = "0.6.0"
pcsc = "2.9.0"
rust-embed = { version = "8.12.0", features = ["mime-guess"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shiguredo_mp4 = "2026.5.0"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
toml = "1.1.2"
tunelith = "0.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
connectrpc-build = "0.9.0"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3.24.0"
tower = { version = "0.5.3", features = ["util"] }

[features]
# Embeds the GUI built into `gui/dist` in the binary and serves it from the
# `serve` command. Development uses the rsbuild dev server instead, so this is
# only enabled for deployment builds.
gui = ["dep:rust-embed"]
