[package]
name = "chibitv"
version = "0.1.0"
edition = "2024"

[dependencies]
chibitv_b25 = { path = "../chibitv_b25" }
chibitv_b10 = { path = "../chibitv_b10" }
chibitv_b24 = { path = "../chibitv_b24" }
chibitv_b60 = { path = "../chibitv_b60" }
chibitv_b61 = { path = "../chibitv_b61" }

anyhow = "1.0.103"
async-trait = "0.1.90"
axum = "0.8.9"
bitstream-io = "4.10.0"
buffa = "0.8.1"
bytes = "1.12.0"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
connectrpc = { version = "0.8.1", features = ["axum"] }
cros-codecs = "0.0.6"
hex = "0.4.3"
mpeg2ts = "0.6.0"
papaya = "0.2.4"
pcsc = "2.9.0"
rust-embed = { version = "8.12.0", features = ["mime-guess"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shiguredo_mp4 = "2026.3.0"
# The SQLite C library is bundled so the runtime image, which carries no
# libsqlite3, needs nothing installed.
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
toml = "1.1.2"
toml_edit = "0.25.12"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
connectrpc-build = "0.8.0"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3.24.0"
tower = { version = "0.5.3", features = ["util"] }

[target.'cfg(unix)'.dependencies]
dvbv5-sys = { version = "0.2.1", optional = true }
libc = { version = "0.2.186", optional = true }

[features]
default = ["dvb"]
dvb = ["dep:dvbv5-sys", "dep:libc"]

# Embeds the GUI built into `gui/dist` in the binary and serves it from the
# `serve` command. Development uses the rsbuild dev server instead, so this is
# only enabled for deployment builds.
gui = ["dep:rust-embed"]
