# Packages the release binary for Linux distributions. The release workflow
# sets ARCH to the Go name of the architecture (amd64, arm64), which nFPM
# translates into the name each package format uses, and VERSION to the
# version being released.
name: chibitv
arch: ${ARCH}
platform: linux
version: ${VERSION}
maintainer: Naoki Ikeguchi <me@s6n.jp>
description: An experimental implementation of the ARIB broadcasting standards
section: video
homepage: https://github.com/siketyan/chibitv

contents:
  - src: target/release/chibitv
    dst: /usr/bin/chibitv
    file_info:
      mode: 0755
  - src: config.toml.example
    dst: /usr/share/doc/chibitv/config.toml.example

# The binary links against libpcsclite, and talks to the CAS
# module through the PC/SC daemon.
depends:
  - libpcsclite1
recommends:
  - pcscd
overrides:
  # The library is required by its soname, which every RPM based
  # distribution provides whatever the package holding it is named.
  rpm:
    depends:
      - libpcsclite.so.1()(64bit)
    recommends:
      - pcsc-lite
  archlinux:
    depends:
      - pcsclite
