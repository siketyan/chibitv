name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the release and its tag
      issues: write # creates the labels of the release pull request
      pull-requests: write # opens the release pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # The release is created as a draft, so that the binaries can be
      # attached before it is published and becomes immutable.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  gui:
    name: GUI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nothing is restored from the cache, so that what is released is built
      # from the sources alone.
      - name: Build the FFmpeg WebAssembly module
        run: bash packages/mediabunny-mpeg2/lib/build.sh
      - name: Enable corepack
        run: corepack enable
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Upload the GUI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui
          path: gui/dist
          if-no-files-found: error

  binaries:
    name: Binaries (${{ matrix.target }})
    needs: [release-please, gui]
    strategy:
      matrix:
        include:
          # ponytail: built on the glibc of the Ubuntu runners, which the
          # packages do not declare, so older distributions install them but
          # cannot run the binary; pin older runners if they matter.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ARCHIVE: dist/chibitv-${{ needs.release-please.outputs.version }}-${{ matrix.target }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdvbv5-dev libpcsclite-dev
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      - name: Download the GUI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gui
          path: gui/dist
      - name: Build
        run: cargo build --release --locked --features gui
      - name: Archive the binary
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          tar --create --gzip --file "$ARCHIVE.tar.gz" --directory target/release chibitv
      - name: Package the binary
        if: runner.os == 'Linux'
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          for packager in deb rpm archlinux; do
            docker run --rm --user "$(id -u):$(id -g)" \
              --volume "$PWD:/work" --workdir /work --env ARCH --env VERSION \
              goreleaser/nfpm:v2.47.0@sha256:a662cb167d7b6d3a83920c83d76b12d02b8ac5dd2c13e5c62c15270b23f6df0c \
              package --config nfpm.yaml --packager "$packager" --target dist/
          done
      - name: Archive the binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist
          Compress-Archive -Path target/release/chibitv.exe -DestinationPath "$env:ARCHIVE.zip"
      - name: Upload the archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  docker:
    name: Docker
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # The permissions of the called workflow cannot exceed these, including
    # those of its deployment, which it skips when it is given a version.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release-please.outputs.version }}

  publish:
    name: Publish
    needs: [release-please, binaries, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # attaches the binaries to the release and publishes it
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Download the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true
      # Once published, an immutable release takes no more assets, so this
      # is the last step.
      - name: Attach the binaries and publish the release
        run: |
          gh release upload "$TAG_NAME" archives/*
          gh release edit "$TAG_NAME" --draft=false --latest
