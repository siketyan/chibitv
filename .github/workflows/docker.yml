name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Building the image takes a while, so pull requests only run it when they
  # touch the image itself.
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/docker.yml
      - Dockerfile
  # A release tags the image with its version, as the tag it creates does not
  # start a workflow of its own.
  workflow_call:
    inputs:
      version:
        description: The version the image is released as
        type: string
        required: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # The image builds FFmpeg, the GUI and the Rust binary from scratch when
    # the layer cache misses.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # pushes the image to the GHCR of this repository
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - name: Collect image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=sha
      # Pull requests only build the image, so signing in is limited to the
      # runs that push it.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          # Caches of the GitHub Actions backend are scoped to the branch that
          # writes them, so a pull request builds on the cache of main without
          # being able to write into it. The registry cache is shared by the
          # runs that push an image.
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max
            ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE_NAME) || '' }}

  deploy:
    name: Deploy
    # The image the host pulls is the one this run has just pushed. A release
    # builds the same commit the push to main has already deployed.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The tailnet trusts the identity of this environment, so the deployment
    # cannot be run from anywhere else in this repository.
    environment: production
    permissions:
      contents: read
      id-token: write # authenticates to the tailnet with workload identity federation
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      # The compose file describes the tuners of the host, so it lives there
      # instead of in this repository.
      DEPLOY_DIRECTORY: ${{ vars.DEPLOY_DIRECTORY }}
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          # Neither identifies a credential on its own, the tailnet authorizes
          # the identity token of this job instead.
          oauth-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:ci
      - name: Pull the image and recreate the container
        # `docker compose restart` would keep running the image the container
        # was created from, so the container is recreated instead.
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_DIRECTORY' && docker compose pull && docker compose up --detach"
